---
- name: Linux baseline - patch, harden, standardize
  hosts: linux
  become: true

  tasks:
    - name: Update apt cache and apply all updates
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Install baseline packages
      ansible.builtin.apt:
        name: [chrony, ufw, fail2ban, unattended-upgrades, htop, curl, vim]
        state: present

    - name: Set timezone to Eastern
      community.general.timezone:
        name: America/New_York

    - name: Sync time with DC01 (Kerberos needs accurate clocks)
      ansible.builtin.copy:
        dest: /etc/chrony/sources.d/dc01.sources
        content: "server 10.10.10.10 iburst prefer\n"
        mode: "0644"
      notify: Restart chrony

    - name: Harden SSH configuration
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        content: |
          PermitRootLogin no
          MaxAuthTries 3
          X11Forwarding no
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh

    - name: Firewall - allow SSH
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Firewall - enable and block all other incoming traffic
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

  handlers:
    - name: Restart chrony
      ansible.builtin.service:
        name: chrony
        state: restarted

    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
