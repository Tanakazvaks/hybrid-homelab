- name: Make SSSD recover automatically if it crashes
  hosts: linux
  become: true
  tasks:
    - name: Create systemd drop-in directory for sssd
      ansible.builtin.file:
        path: /etc/systemd/system/sssd.service.d
        state: directory

    - name: Restart SSSD automatically on failure
      ansible.builtin.copy:
        dest: /etc/systemd/system/sssd.service.d/restart.conf
        content: |
          # kubelet crashed on the k8s workers when SSSD was down (its startup user lookup failed),
          # so SSSD must recover on its own instead of staying failed.
          [Unit]
          StartLimitIntervalSec=0

          [Service]
          Restart=on-failure
          RestartSec=10
      register: dropin

    - name: Reload systemd and make sure SSSD is running
      ansible.builtin.systemd:
        name: sssd
        state: started
        enabled: true
        daemon_reload: "{{ dropin.changed }}"
