global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: linux
    static_configs:
      - targets: ['10.10.10.21:9100']
        labels: {host: lnx01, os: linux, role: monitoring}
      - targets: ['10.10.10.22:9100']
        labels: {host: lnx02, os: linux, role: member}
      - targets: ['10.10.10.23:9100']
        labels: {host: lnx03, os: linux, role: member}

  - job_name: windows
    static_configs:
      - targets: ['10.10.10.10:9182']
        labels: {host: dc01, os: windows, role: domain-controller}
